name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest

      # Model/diffusion/vae/fid tests are CUDA-gated and skip on CPU; the suite
      # still imports every module and collects cleanly, so install + wiring are
      # verified in public. Full GPU runs happen locally (pytest tests/ -q).
      - name: Run tests (GPU cases skip on CPU)
        run: python -m pytest tests/ -q
